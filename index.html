<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Productivity Toolkit</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #444;
    }
    .section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      width: 70%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      margin-left: 10px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Daily Productivity Toolkit</h1>

  <div class="section">
    <h2>Motivational Quote</h2>
    <p id="quote">"The future depends on what you do today." – Mahatma Gandhi</p>
  </div>

  <div class="section">
    <h2>To-Do List</h2>
    <input type="text" id="todoInput" placeholder="Add a task" />
    <button onclick="addTodo()">Add</button>
    <ul id="todoList"></ul>
  </div>

  <div class="section">
    <h2>Quick Notes</h2>
    <textarea id="notes" placeholder="Write something..."></textarea>
    <button onclick="saveNotes()">Save Notes</button>
  </div>

  <script>
    function addTodo() {
      const input = document.getElementById('todoInput');
      const list = document.getElementById('todoList');
      if (input.value.trim() !== '') {
        const li = document.createElement('li');
        li.textContent = input.value;
        list.appendChild(li);
        input.value = '';
      }
    }

    function saveNotes() {
      const text = document.getElementById('notes').value;
      localStorage.setItem('dailyNotes', text);
      alert('Notes saved locally!');
    }

    window.onload = () => {
      const savedNotes = localStorage.getItem('dailyNotes');
      if (savedNotes) {
        document.getElementById('notes').value = savedNotes;
      }
    };
  </script>
</body>
</html>
